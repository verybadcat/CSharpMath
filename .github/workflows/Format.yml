name: Check format

on: [push, pull_request]
jobs:
  Excluding_Typography:
    if: (github.event_name == 'pull_request') == github.event.pull_request.head.repo.fork
    runs-on: windows-latest
    steps:
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.x'
        workloads: maui-ios, maui-maccatalyst, maui-android, wasm-tools
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Check formatting (Fix with "dotnet format --exclude Typography" at repository root)
      # CSharpMath.Uno.Example is excluded: its Uno.Resizetizer splash task crashes
      # under dotnet format due to a SkiaSharp assembly-version conflict (the tool
      # loads SkiaSharp 2.88 while the resizetizer needs 3.x / native lib 116).
      run: dotnet format --exclude Typography --exclude CSharpMath.Uno.Example --verify-no-changes --verbosity diagnostic